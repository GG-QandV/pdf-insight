name: Deploy API (Cloudflare Worker)

# Runs only when the Worker changes and the Cloudflare secrets are configured in the repo.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm ci --prefix worker
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --prefix worker wrangler deploy --config worker/wrangler.toml
